<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Fundo Squircle Gradiente -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#232734"/>
      <stop offset="40%" stop-color="#181b23"/>
      <stop offset="100%" stop-color="#0f1116"/>
    </linearGradient>

    <!-- Borda Neon Sutil -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#6366f1" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Brilho Radial Central -->
    <radialGradient id="centerAura" cx="52%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#181b23" stop-opacity="0"/>
    </radialGradient>

    <!-- Fita de Filme -->
    <linearGradient id="filmGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Gradiente do Play: Contorno Aura -->
    <linearGradient id="playAuraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#6366f1"/>
      <stop offset="85%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Gradiente do Play: Face Principal -->
    <linearGradient id="playFaceGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="30%" stop-color="#2563eb"/>
      <stop offset="70%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>

    <!-- Gradiente do Play: Faceta de Luz Inferior -->
    <linearGradient id="playFacetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Trilhas da Timeline -->
    <linearGradient id="trackVideoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="trackAddGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>

    <linearGradient id="trackAudioGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
  </defs>

  <!-- 1. Base Squircle -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#bgGrad)"/>
  <rect x="21" y="21" width="470" height="470" rx="107" fill="none" stroke="url(#rimGrad)" stroke-width="4"/>

  <!-- Aura de Luz de Fundo -->
  <circle cx="264" cy="216" r="180" fill="url(#centerAura)"/>

  <!-- 2. Fita de Filme Superior (Design elegante em arco dinâmico) -->
  <g transform="rotate(-11 256 200)" opacity="0.45">
    <rect x="52" y="96" width="408" height="44" rx="8" fill="url(#filmGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>
    <!-- Linha central suave -->
    <line x1="52" y1="118" x2="460" y2="118" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.15"/>
    <!-- Perfurações quadradas precisas -->
    <rect x="66" y="101" width="14" height="11" rx="2.5" fill="#38bdf8" opacity="0.65"/>
    <rect x="96" y="101" width="14" height="11" rx="2.5" fill="#38bdf8" opacity="0.65"/>
    <rect x="126" y="101" width="14" height="11" rx="2.5" fill="#38bdf8" opacity="0.65"/>
    <rect x="156" y="101" width="14" height="11" rx="2.5" fill="#38bdf8" opacity="0.65"/>
    <rect x="186" y="101" width="14" height="11" rx="2.5" fill="#38bdf8" opacity="0.65"/>
    <rect x="216" y="101" width="14" height="11" rx="2.5" fill="#38bdf8" opacity="0.65"/>
    <rect x="246" y="101" width="14" height="11" rx="2.5" fill="#38bdf8" opacity="0.65"/>
    <rect x="276" y="101" width="14" height="11" rx="2.5" fill="#38bdf8" opacity="0.65"/>
    <rect x="306" y="101" width="14" height="11" rx="2.5" fill="#38bdf8" opacity="0.65"/>
    <rect x="336" y="101" width="14" height="11" rx="2.5" fill="#38bdf8" opacity="0.65"/>
    <rect x="366" y="101" width="14" height="11" rx="2.5" fill="#38bdf8" opacity="0.65"/>
    <rect x="396" y="101" width="14" height="11" rx="2.5" fill="#38bdf8" opacity="0.65"/>
    <rect x="426" y="101" width="14" height="11" rx="2.5" fill="#38bdf8" opacity="0.65"/>

    <rect x="66" y="124" width="14" height="11" rx="2.5" fill="#38bdf8" opacity="0.65"/>
    <rect x="96" y="124" width="14" height="11" rx="2.5" fill="#38bdf8" opacity="0.65"/>
    <rect x="126" y="124" width="14" height="11" rx="2.5" fill="#38bdf8" opacity="0.65"/>
    <rect x="156" y="124" width="14" height="11" rx="2.5" fill="#38bdf8" opacity="0.65"/>
    <rect x="186" y="124" width="14" height="11" rx="2.5" fill="#38bdf8" opacity="0.65"/>
    <rect x="216" y="124" width="14" height="11" rx="2.5" fill="#38bdf8" opacity="0.65"/>
    <rect x="246" y="124" width="14" height="11" rx="2.5" fill="#38bdf8" opacity="0.65"/>
    <rect x="276" y="124" width="14" height="11" rx="2.5" fill="#38bdf8" opacity="0.65"/>
    <rect x="306" y="124" width="14" height="11" rx="2.5" fill="#38bdf8" opacity="0.65"/>
    <rect x="336" y="124" width="14" height="11" rx="2.5" fill="#38bdf8" opacity="0.65"/>
    <rect x="366" y="124" width="14" height="11" rx="2.5" fill="#38bdf8" opacity="0.65"/>
    <rect x="396" y="124" width="14" height="11" rx="2.5" fill="#38bdf8" opacity="0.65"/>
    <rect x="426" y="124" width="14" height="11" rx="2.5" fill="#38bdf8" opacity="0.65"/>
  </g>

  <!-- 3. Trilhas da Linha do Tempo (Base) -->
  <g opacity="0.9">
    <!-- Trilha 1 (Vídeo / Ciano) -->
    <rect x="74" y="362" width="76" height="21" rx="6" fill="url(#trackVideoGrad)"/>
    <rect x="158" y="362" width="168" height="21" rx="6" fill="url(#trackVideoGrad)"/>
    <rect x="334" y="362" width="104" height="21" rx="6" fill="url(#trackVideoGrad)" opacity="0.8"/>

    <!-- Trilha 2 (Adicionais / Magenta) -->
    <rect x="74" y="393" width="144" height="21" rx="6" fill="url(#trackAddGrad)"/>
    <rect x="226" y="393" width="100" height="21" rx="6" fill="url(#trackAddGrad)"/>
    <rect x="334" y="393" width="104" height="21" rx="6" fill="url(#trackAddGrad)" opacity="0.85"/>

    <!-- Trilha 3 (Áudio / Coral) -->
    <rect x="74" y="424" width="62" height="20" rx="6" fill="url(#trackAudioGrad)" opacity="0.75"/>
    <rect x="144" y="424" width="124" height="20" rx="6" fill="url(#trackAudioGrad)"/>
    <rect x="276" y="424" width="162" height="20" rx="6" fill="url(#trackAudioGrad)"/>
  </g>

  <!-- Cursor Playhead -->
  <line x1="280" y1="346" x2="280" y2="456" stroke="#f43f5e" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="273,346 287,346 280,356" fill="#f43f5e"/>

  <!-- 4. Play Button Central (Opticamente equilibrado e facetado) -->
  <!-- Sombra Projetada Suave -->
  <path d="M 200 128
           C 200 114, 215 105, 227 113
           L 374 205
           C 386 213, 386 231, 374 239
           L 227 331
           C 215 339, 200 330, 200 316
           Z"
        fill="#000000" opacity="0.45" transform="translate(0, 10)"/>

  <!-- Anel Externo Neon (Aura) -->
  <path d="M 200 128
           C 200 114, 215 105, 227 113
           L 374 205
           C 386 213, 386 231, 374 239
           L 227 331
           C 215 339, 200 330, 200 316
           Z"
        fill="none" stroke="url(#playAuraGrad)" stroke-width="18" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Corpo do Play -->
  <path d="M 206 136
           C 206 126, 217 120, 226 125
           L 366 212
           C 375 218, 375 228, 366 234
           L 226 321
           C 217 326, 206 320, 206 310
           Z"
        fill="url(#playFaceGrad)"/>

  <!-- Faceta / Reflexo de Vidro na metade superior -->
  <path d="M 206 136
           C 206 126, 217 120, 226 125
           L 366 212
           C 370 214, 372 217, 372 221
           L 206 221
           Z"
        fill="url(#playFacetGrad)"/>

  <path d="M 206 136
           C 206 126, 217 120, 226 125
           L 366 212
           C 370 214, 372 217, 372 221
           L 206 221
           Z"
        fill="#ffffff" opacity="0.25"/>

  <!-- Cristal Interno Translúcido -->
  <path d="M 230 172
           C 230 166, 237 162, 242 165
           L 324 218
           C 329 221, 329 229, 324 232
           L 242 285
           C 237 288, 230 284, 230 278
           Z"
        fill="#ffffff" opacity="0.18"/>
</svg>
