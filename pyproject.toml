[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "videomanager"
version = "4.2"
description = "Baixa, converte e edita vídeo e áudio, e ajusta metadados (Windows e Linux)"
readme = "README.md"
# Expressão SPDX (PEP 639), que pede setuptools 77 ou mais novo.
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
dependencies = [
    # PySide6 6.12.0 com Python 3.10: o interpretador morre ao finalizar ("Fatal Python error:
    # none_dealloc: deallocating None"), com todos os testes passando — reproduzido no main puro, e com
    # a 6.11.1 não acontece. Foi o que derrubou o job do Ubuntu com 3.10 na CI. O teto vale só ali;
    # tire-o quando houver uma 6.12.x que corrija.
    "PySide6>=6.6,<6.12; python_version < '3.11'",
    # Teto também no 3.11+: o pacote do Windows sai da CI, que instala a versão mais nova, e a 6.12 mudou o QSS dos
    # QSpinBox (o número dos campos da aba Propriedades sumia no .exe, sem erro e com a suíte verde, porque o
    # desenvolvimento rodava a 6.11). O teto é a versão que as telas e a suíte já provaram; suba-o depois de
    # rodar ambas com a seguinte (tests/test_campo_numerico_visivel.py guarda o que aquela mudança quebrou).
    "PySide6>=6.6,<6.13; python_version >= '3.11'",
    # Sem teto de versão de propósito: extratores quebram quando as plataformas
    # mudam, então o yt-dlp precisa poder ser atualizado a qualquer momento.
    # O extra "default" traz o que o pacote não tinha: os scripts do solver
    # JavaScript do YouTube (yt-dlp-ejs), o mutagen para capa em opus/ogg/flac,
    # certificados, brotli e websockets. O extra "curl-cffi" traz a biblioteca com que o yt-dlp imita a impressão digital TLS
    # de um navegador: sem ela, sites que a exigem (o Dailymotion, medido) respondem "none of these impersonate targets are
    # available" na primeira URL, e a lista dos que a usam tem trinta extratores (Instagram, TikTok, Reddit, Vimeo...).
    "yt-dlp[default,curl-cffi]>=2025.1.1",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyflakes>=3.0"]

[project.gui-scripts]
videomanager = "videomanager.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
videomanager = ["resources/*", "resources/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: testes que acessam a internet de verdade",
    "ffmpeg: integração com ffmpeg e ffprobe locais",
]
# Testes de rede ficam fora da execução padrão: dependem de vídeos que podem
# sair do ar e de extratores que mudam. Rode-os com: pytest -m network
addopts = "-m 'not network'"
