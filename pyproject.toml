[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "videomanager"
version = "1.0"
description = "Downloader e conversor de vídeo/áudio multiplataforma (Windows e Linux)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    # Sem teto de versão de propósito: extratores quebram quando as plataformas
    # mudam, então o yt-dlp precisa poder ser atualizado a qualquer momento.
    "yt-dlp>=2025.1.1",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyflakes>=3.0"]

[project.gui-scripts]
videomanager = "videomanager.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
videomanager = ["resources/*", "resources/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: testes que acessam a internet de verdade",
    "ffmpeg: integração com ffmpeg e ffprobe locais",
]
# Testes de rede ficam fora da execução padrão: dependem de vídeos que podem
# sair do ar e de extratores que mudam. Rode-os com: pytest -m network
addopts = "-m 'not network'"
