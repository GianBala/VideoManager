name: Testes e arquitetura

on: [push, pull_request]

permissions:
  contents: read

# As actions vão fixadas pelo commit, e não pela tag: a tag é móvel, e quem a
# move roda código neste job, que gera o pacote entregue. O Dependabot
# (.github/dependabot.yml) propõe as atualizações; o comentário diz a versão.

jobs:
  internal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.10'
      - run: python -m pip install pytest
      - name: Regras sem dependências desktop
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/domain tests/application tests/architecture

  desktop:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Ferramentas Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libopengl0 libxcb-cursor0
      - name: Ferramentas Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
          }
      - run: python -m pip install -e ".[dev]"
      # O Ubuntu traz o ffmpeg 6.1 e o Chocolatey o 9: rodar com os dois é o que
      # revela opção removida e filtro que mudou de comportamento. Num dos jobs
      # do Linux entra também o ffmpeg que o pacote embute, que é o que o
      # usuário recebe — sem ele, nada testaria a combinação entregue.
      - name: ffmpeg do pacote (o mesmo que o usuário recebe)
        if: runner.os == 'Linux' && matrix.python == '3.12'
        env:
          PYTHONPATH: src
        run: python packaging/fetch_binaries.py
      - run: python -m pyflakes src/videomanager tests scripts
      # Nomes e atributos que não existem: o pyflakes não segue importação nem
      # self. Fica aqui, e não no job internal, porque importa os módulos para
      # conferir — sem o PySide6 e o yt-dlp, acusa 712 falsos.
      - name: Referências sem destino
        env:
          PYTHONPATH: src
        run: python scripts/check_references.py
      - run: python -m pytest -q
      - name: Gerar pacote Linux
        if: runner.os == 'Linux' && matrix.python == '3.12'
        env:
          VM_BUNDLE_FFMPEG: '0'
        run: |
          python -m pip install pyinstaller
          pyinstaller --noconfirm packaging/videomanager.spec
          packaging/smoke_run.sh dist/VideoManager/VideoManager 30
      - name: Gerar e verificar pacote Windows
        if: runner.os == 'Windows' && matrix.python == '3.12'
        env:
          VM_BUNDLE_FFMPEG: '1'
        shell: pwsh
        run: |
          python -m pip install pyinstaller
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao instalar PyInstaller.' }
          python packaging/fetch_binaries.py
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao preparar ffmpeg para o pacote.' }
          # O mesmo passo do build local: sem o .ico gerado antes, o spec deixa o
          # executável com o ícone padrão do PyInstaller — e era assim que o
          # pacote guardado aqui saía, porque a conferência do ícone só roda com
          # -Icon.
          python packaging/make_icon.py
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao gerar o icone.' }
          pyinstaller --noconfirm packaging/videomanager.spec
          if ($LASTEXITCODE -ne 0) { throw 'Falha no empacotamento.' }
          .\packaging\smoke_windows.ps1 -Executable '.\dist\VideoManager.exe' -Icon '.\build\videomanager.ico'
      - name: Guardar pacote Windows validado
        if: runner.os == 'Windows' && matrix.python == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: VideoManager-Windows
          path: dist/VideoManager.exe
          retention-days: 7
