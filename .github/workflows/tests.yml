name: Testes e arquitetura

on: [push, pull_request]

permissions:
  contents: read

# As actions vão fixadas pelo commit, e não pela tag: a tag é móvel, e quem a
# move roda código neste job, que gera o pacote entregue. O Dependabot
# (.github/dependabot.yml) propõe as atualizações; o comentário diz a versão.

jobs:
  internal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.10'
      - run: python -m pip install pytest
      - name: Regras sem dependências desktop
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/domain tests/application tests/architecture

  desktop:
    name: desktop (${{ matrix.os }}, ${{ matrix.python }}, fatia ${{ matrix.shard }}/${{ matrix.shards }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # As integrações com o ffmpeg (`-m ffmpeg`) são ~85% do tempo da suíte e
        # dependem da versão do ffmpeg, não do Python. O Windows usa o mesmo
        # ffmpeg 9 do Chocolatey nas duas versões, então no 3.10 elas se repetiam
        # sem cobrir nada novo; o resto da suíte (onde o PySide6 6.12 derrubou o
        # 3.10) continua rodando. O Ubuntu 3.10 mantém tudo: é o único com o
        # ffmpeg 6.1 do sistema.
        #
        # `shard`/`shards` dividem a suíte entre duas máquinas (ver `fatiar` em
        # tests/conftest.py): cada job tem núcleos próprios, e as integrações
        # com o ffmpeg já ocupam todos os de um runner. Duas fatias, e não mais,
        # porque cada uma repete ~1 min de preparação e a conta de jobs
        # simultâneos (20) já fecha com duas execuções por commit (push e PR).
        # Todas as fatias de uma célula precisam do mesmo `marcador`.
        include:
          - {os: ubuntu-latest,  python: '3.10', shard: 1, shards: 2, marcador: 'not network'}
          - {os: ubuntu-latest,  python: '3.10', shard: 2, shards: 2, marcador: 'not network'}
          - {os: ubuntu-latest,  python: '3.12', shard: 1, shards: 2, marcador: 'not network'}
          - {os: ubuntu-latest,  python: '3.12', shard: 2, shards: 2, marcador: 'not network'}
          - {os: windows-latest, python: '3.10', shard: 1, shards: 1, marcador: 'not ffmpeg and not network'}
          - {os: windows-latest, python: '3.12', shard: 1, shards: 2, marcador: 'not network'}
          - {os: windows-latest, python: '3.12', shard: 2, shards: 2, marcador: 'not network'}
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      VM_SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          # O PySide6 pesa ~200 MB e o `pip install` do Windows levava 40–45 s. O
          # cache guarda só os arquivos baixados: a resolução continua pegando a
          # versão mais nova, que é o que a CI quer testar.
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Ferramentas Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libopengl0 libxcb-cursor0
      - name: Ferramentas Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
          }
      - run: python -m pip install -e ".[dev]"
      # O Ubuntu traz o ffmpeg 6.1 e o Chocolatey o 9: rodar com os dois é o que
      # revela opção removida e filtro que mudou de comportamento. Num dos jobs
      # do Linux entra também o ffmpeg que o pacote embute, que é o que o
      # usuário recebe — sem ele, nada testaria a combinação entregue.
      - name: ffmpeg do pacote (o mesmo que o usuário recebe)
        if: runner.os == 'Linux' && matrix.python == '3.12'
        env:
          PYTHONPATH: src
        run: python packaging/fetch_binaries.py
      # As conferências estáticas não dependem da fatia: rodam na primeira só.
      - name: pyflakes
        if: matrix.shard == 1
        run: python -m pyflakes src/videomanager tests scripts
      # Nomes e atributos que não existem: o pyflakes não segue importação nem
      # self. Fica aqui, e não no job internal, porque importa os módulos para
      # conferir — sem o PySide6 e o yt-dlp, acusa 712 falsos.
      - name: Referências sem destino
        if: matrix.shard == 1
        env:
          PYTHONPATH: src
        run: python scripts/check_references.py
      # Sem pytest-xdist de propósito. Em 4 núcleos locais ele cortava 35% de uma
      # fatia, mas no runner não rendeu nada (98–110 s por fatia, contra 103–116 s
      # da metade em série) e a carga extra estourou o limite de 5 s do teste de
      # cancelamento no Windows. Quem divide o trabalho aqui são as fatias.
      - run: python -m pytest -q -m "${{ matrix.marcador }}"

  # Os pacotes não dependem do resultado dos testes, então rodam ao lado deles:
  # no Windows, empacotar depois do pytest somava ~110–170 s ao job mais lento
  # da CI (o `desktop` do Windows com Python 3.12), que era quem decidia o tempo
  # da execução inteira. O ambiente é o mesmo de antes — no Linux, o ffmpeg do
  # apt e o `fetch_binaries.py` (que traz o Deno para o pacote).
  pacote:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Ferramentas Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libopengl0 libxcb-cursor0
      - run: python -m pip install -e ".[dev]"
      - name: Deno do pacote
        if: runner.os == 'Linux'
        env:
          PYTHONPATH: src
        run: python packaging/fetch_binaries.py
      - name: Gerar pacote Linux
        if: runner.os == 'Linux'
        env:
          VM_BUNDLE_FFMPEG: '0'
        run: |
          python -m pip install pyinstaller
          pyinstaller --noconfirm packaging/videomanager.spec
          packaging/smoke_run.sh dist/VideoManager/VideoManager 30
      - name: Gerar e verificar pacote Windows
        if: runner.os == 'Windows'
        env:
          VM_BUNDLE_FFMPEG: '1'
        shell: pwsh
        run: |
          python -m pip install pyinstaller
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao instalar PyInstaller.' }
          python packaging/fetch_binaries.py
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao preparar ffmpeg para o pacote.' }
          # O mesmo passo do build local: sem o .ico gerado antes, o spec deixa o
          # executável com o ícone padrão do PyInstaller — e era assim que o
          # pacote guardado aqui saía, porque a conferência do ícone só roda com
          # -Icon.
          python packaging/make_icon.py
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao gerar o icone.' }
          pyinstaller --noconfirm packaging/videomanager.spec
          if ($LASTEXITCODE -ne 0) { throw 'Falha no empacotamento.' }
          .\packaging\smoke_windows.ps1 -Executable '.\dist\VideoManager.exe' -Icon '.\build\videomanager.ico'
      # Guardado mesmo que algum teste do `desktop` falhe, já que os jobs correm
      # juntos: o pacote só vale como entrega com a execução inteira verde.
      - name: Guardar pacote Windows verificado
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: VideoManager-Windows
          path: dist/VideoManager.exe
          retention-days: 7
